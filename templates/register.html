<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – Sistem Inventaris</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #198754, #146c43);
            padding: 2rem;
            text-align: center;
            border: none;
        }
        .card-header .icon-wrap {
            width: 70px; height: 70px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2rem;
            color: white;
        }
        .card-body { padding: 2rem; }
        .form-control:focus, .form-select:focus {
            border-color: #198754;
            box-shadow: 0 0 0 0.2rem rgba(25,135,84,.2);
        }
        .btn-register {
            background: linear-gradient(135deg, #198754, #146c43);
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: 600;
        }
        .btn-register:hover { background: linear-gradient(135deg, #146c43, #0f5132); transform: translateY(-1px); }
        .input-group-text { background: #f8f9fa; border-right: none; }
        .form-control, .form-select { border-left: none; }
        .role-badge { font-size: 0.75rem; }

        /* ── Password Strength Indicator ── */
        .strength-bar {
            height: 6px;
            border-radius: 10px;
            background: #e9ecef;
            overflow: hidden;
            margin-top: 8px;
        }
        .strength-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.3s ease, background 0.3s ease;
            width: 0%;
        }
        .req-list { list-style: none; padding: 0; margin: 10px 0 0; font-size: 0.8rem; }
        .req-list li { padding: 2px 0; color: #6c757d; transition: color 0.2s; }
        .req-list li.ok  { color: #198754; }
        .req-list li.ok  .bi { color: #198754; }
        .req-list li .bi { color: #adb5bd; margin-right: 5px; }
        .show-pw-btn { cursor: pointer; border-left: 1px solid #dee2e6 !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card">
                    <div class="card-header">
                        <div class="icon-wrap"><i class="bi bi-person-plus-fill"></i></div>
                        <h4 class="text-white mb-0 fw-bold">Buat Akun Baru</h4>
                        <small class="text-white-50">Registrasi Sistem Inventaris</small>
                    </div>
                    <div class="card-body">

                        {% if error %}
                        <div class="alert alert-danger d-flex align-items-start gap-2 py-2" role="alert">
                            <i class="bi bi-shield-exclamation mt-1 flex-shrink-0"></i>
                            <span>{{ error }}</span>
                        </div>
                        {% endif %}

                        <form method="POST" id="registerForm" novalidate>
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <!-- Username -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Username</label>
                                <!-- Input divalidasi dan disanitasi otomatis oleh Jinja2 untuk mencegah XSS -->
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person-fill text-secondary"></i></span>
                                    <input type="text" class="form-control" name="username"
                                           placeholder="Buat username" required autofocus
                                           value="{{ username }}">
                                </div>
                            </div>

                            <!-- Password + Strength Meter -->
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock-fill text-secondary"></i></span>
                                    <input type="password" class="form-control" name="password"
                                           id="passwordInput" placeholder="Buat password kuat" required>
                                    <span class="input-group-text show-pw-btn" id="togglePw" title="Tampilkan/Sembunyikan">
                                        <i class="bi bi-eye-fill text-secondary" id="eyeIcon"></i>
                                    </span>
                                </div>

                                <!-- Strength Bar -->
                                <div class="strength-bar">
                                    <div class="strength-fill" id="strengthFill"></div>
                                </div>
                                <div class="d-flex justify-content-between mt-1">
                                    <small class="text-muted" id="strengthLabel">Ketik password...</small>
                                </div>

                                <!-- Checklist Persyaratan -->
                                <ul class="req-list mt-2" id="reqList">
                                    <li id="req-len">  <i class="bi bi-circle"></i>Minimal 8 karakter</li>
                                    <li id="req-upper"><i class="bi bi-circle"></i>Huruf besar (A-Z)</li>
                                    <li id="req-lower"><i class="bi bi-circle"></i>Huruf kecil (a-z)</li>
                                    <li id="req-num">  <i class="bi bi-circle"></i>Angka (0-9)</li>
                                    <li id="req-sym">  <i class="bi bi-circle"></i>Simbol (!@#$%^&* dll.)</li>
                                </ul>
                            </div>

                            <!-- Role -->
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Role (Peran)</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-shield-fill text-secondary"></i></span>
                                    <select class="form-select" name="role">
                                        <option value="petugas" {% if role == 'petugas' %}selected{% endif %}>👷 Petugas Gudang (User)</option>
                                        <option value="admin"   {% if role == 'admin' %}selected{% endif %}>👑 Admin</option>
                                    </select>
                                </div>
                                <div class="mt-2 d-flex gap-2">
                                    <span class="badge bg-secondary role-badge">Petugas: lihat &amp; update stok</span>
                                    <span class="badge bg-danger role-badge">Admin: dapat hapus barang</span>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success btn-register w-100" id="submitBtn" disabled>
                                <i class="bi bi-person-check-fill me-2"></i>Daftar Sekarang
                            </button>
                        </form>

                        <hr class="my-3">
                        <div class="text-center">
                            <small class="text-muted">Sudah punya akun?
                                <a href="/login" class="text-success fw-semibold text-decoration-none">Login di sini</a>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const pwInput   = document.getElementById('passwordInput');
    const fill      = document.getElementById('strengthFill');
    const label     = document.getElementById('strengthLabel');
    const submitBtn = document.getElementById('submitBtn');
    const togglePw  = document.getElementById('togglePw');
    const eyeIcon   = document.getElementById('eyeIcon');

    // ── Kriteria ──
    const checks = {
        'req-len':   pw => pw.length >= 8,
        'req-upper': pw => /[A-Z]/.test(pw),
        'req-lower': pw => /[a-z]/.test(pw),
        'req-num':   pw => /[0-9]/.test(pw),
        'req-sym':   pw => /[!@#$%^&*()\-_=+\[\]{}|;:,.<>?\/`~\\'"]/.test(pw),
    };

    const levels = [
        { pct: 0,   color: '#e9ecef', text: 'Ketik password...' },
        { pct: 20,  color: '#dc3545', text: '🔴 Sangat Lemah'  },
        { pct: 40,  color: '#fd7e14', text: '🟠 Lemah'         },
        { pct: 60,  color: '#ffc107', text: '🟡 Cukup'         },
        { pct: 80,  color: '#0dcaf0', text: '🔵 Kuat'          },
        { pct: 100, color: '#198754', text: '🟢 Sangat Kuat ✓' },
    ];

    pwInput.addEventListener('input', () => {
        const pw = pwInput.value;
        let passed = 0;

        for (const [id, fn] of Object.entries(checks)) {
            const li = document.getElementById(id);
            const icon = li.querySelector('.bi');
            if (fn(pw)) {
                passed++;
                li.classList.add('ok');
                icon.className = 'bi bi-check-circle-fill';
            } else {
                li.classList.remove('ok');
                icon.className = 'bi bi-circle';
            }
        }

        const lvl = pw.length === 0 ? levels[0] : levels[passed];
        fill.style.width      = lvl.pct + '%';
        fill.style.background = lvl.color;
        label.textContent     = lvl.text;
        label.style.color     = lvl.color;

        // Aktifkan tombol hanya jika semua 5 kriteria terpenuhi
        submitBtn.disabled = (passed < 5);
    });

    // ── Toggle Show/Hide Password ──
    togglePw.addEventListener('click', () => {
        const isHidden = pwInput.type === 'password';
        pwInput.type = isHidden ? 'text' : 'password';
        eyeIcon.className = isHidden ? 'bi bi-eye-slash-fill text-secondary' : 'bi bi-eye-fill text-secondary';
    });
</script>
</body>
</html>
