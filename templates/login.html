<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Sistem Inventaris</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        .card-header {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            padding: 2rem;
            text-align: center;
            border: none;
        }
        .card-header .icon-wrap {
            width: 70px; height: 70px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2rem;
            color: white;
        }
        .card-body { padding: 2rem; }
        .form-control:focus { border-color: #0d6efd; box-shadow: 0 0 0 0.2rem rgba(13,110,253,.2); }
        .btn-login {
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .btn-login:hover { background: linear-gradient(135deg, #0a58ca, #084298); transform: translateY(-1px); }
        .input-group-text { background: #f8f9fa; border-right: none; }
        .form-control { border-left: none; }
        .form-control:focus + .input-group-text, .input-group-text + .form-control:focus { border-color: #0d6efd; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card">
                    <div class="card-header">
                        <div class="icon-wrap"><i class="bi bi-shield-lock-fill"></i></div>
                        <h4 class="text-white mb-0 fw-bold">Sistem Inventaris</h4>
                        <small class="text-white-50">Silakan login untuk melanjutkan</small>
                    </div>
                    <div class="card-body">
                        {% if error %}
                            {% if '⛔' in error %}
                            <div class="alert alert-warning d-flex align-items-start gap-2 py-2" role="alert">
                                <i class="bi bi-exclamation-triangle-fill mt-1"></i>
                                <span>{{ error }}</span>
                            </div>
                            {% else %}
                            <div class="alert alert-danger d-flex align-items-start gap-2 py-2" role="alert">
                                <i class="bi bi-x-circle-fill mt-1"></i>
                                <span>{{ error }}</span>
                            </div>
                            {% endif %}
                        {% endif %}

                        <form method="POST">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person-fill text-secondary"></i></span>
                                    <input type="text" class="form-control" name="username" placeholder="Masukkan username"
                                           value="{{ username or '' }}" required autofocus autocapitalize="none" autocomplete="username">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock-fill text-secondary"></i></span>
                                    <input type="password" class="form-control" id="loginPassword" name="password"
                                           placeholder="Masukkan password" required autocomplete="current-password">
                                    <button class="btn btn-outline-secondary" type="button" id="toggleLoginPw" title="Tampilkan/Sembunyikan">
                                        <i class="bi bi-eye-fill" id="eyeIcon"></i>
                                    </button>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary btn-login w-100">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Login
                            </button>
                        </form>

                        <hr class="my-3">
                        <div class="text-center">
                            <small class="text-muted">Belum punya akun?
                                <a href="/register" class="text-primary fw-semibold text-decoration-none">Daftar di sini</a>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const togglePw = document.getElementById('toggleLoginPw');
    const pwInput  = document.getElementById('loginPassword');
    const eyeIcon  = document.getElementById('eyeIcon');
    if (togglePw && pwInput && eyeIcon) {
        togglePw.addEventListener('click', () => {
            const isHidden = pwInput.type === 'password';
            pwInput.type = isHidden ? 'text' : 'password';
            eyeIcon.className = isHidden ? 'bi bi-eye-slash-fill' : 'bi bi-eye-fill';
        });
    }
</script>
</body>
</html>
